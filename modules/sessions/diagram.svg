<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Transcripts from six agent CLIs are imported into Markdown archives with indexes in ~/.openagent, which a later session searches">
  <style>
    .panel { fill: #f6f8fa; stroke: #d1d9e0; } .chip { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .muted { fill: #59636e; } .accent { fill: #bc4c00; }
    .line { stroke: #59636e; } .arrowhead { fill: #59636e; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #3d444d; } .chip { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .accent { fill: #f0883e; }
      .line { stroke: #9198a1; } .arrowhead { fill: #9198a1; }
    }
  </style>

  <rect class="panel" x="1" y="1" width="238" height="398" rx="10"/>
  <text class="ink sans" x="20" y="36" font-size="16" font-weight="600">On this machine</text>
  <text class="muted sans" x="20" y="56" font-size="12.5">six CLIs, six transcript formats</text>
  <g class="sans" font-size="14">
    <rect class="chip" x="20" y="74" width="198" height="36" rx="6"/><text class="ink" x="36" y="97">Claude Code</text>
    <rect class="chip" x="20" y="118" width="198" height="36" rx="6"/><text class="ink" x="36" y="141">Codex</text>
    <rect class="chip" x="20" y="162" width="198" height="36" rx="6"/><text class="ink" x="36" y="185">Gemini CLI</text>
    <rect class="chip" x="20" y="206" width="198" height="36" rx="6"/><text class="ink" x="36" y="229">Grok Build</text>
    <rect class="chip" x="20" y="250" width="198" height="36" rx="6"/><text class="ink" x="36" y="273">Antigravity</text>
    <rect class="chip" x="20" y="294" width="198" height="36" rx="6"/><text class="ink" x="36" y="317">Cursor Agent</text>
  </g>

  <line class="line" x1="250" y1="200" x2="330" y2="200" stroke-width="1.5"/>
  <path class="arrowhead" d="M 338 200 L 328 194 L 328 206 Z"/>
  <text class="ink mono" x="294" y="184" font-size="11.5" text-anchor="middle">import-sessions</text>
  <text class="muted sans" x="294" y="222" font-size="11.5" text-anchor="middle">no model,</text>
  <text class="muted sans" x="294" y="238" font-size="11.5" text-anchor="middle">no network</text>

  <rect class="panel" x="349" y="1" width="530" height="398" rx="10"/>
  <text class="ink sans" x="370" y="36" font-size="16" font-weight="600">Searchable Markdown, outside your project</text>
  <g class="mono" font-size="13.5">
    <text class="ink" x="370" y="76">~/.openagent/sessions/imported/</text>
    <text class="accent" x="370" y="100">├── index.md</text>
    <text class="ink" x="370" y="124">├── my-app/</text>
    <text class="accent" x="370" y="148">│   ├── index.md</text>
    <text class="accent" x="370" y="172">│   ├── 20261012-0930-…-auth-refactor.md</text>
    <text class="accent" x="370" y="196">│   └── 20261019-2210-…-cache-design.md</text>
    <text class="ink" x="370" y="220">└── _prompts/</text>
  </g>
  <g class="muted sans" font-size="12.5">
    <text x="510" y="100">every archive, newest first</text>
    <text x="510" y="220">with --prompts: what you typed, and your rules</text>
  </g>
  <line class="line" x1="370" y1="252" x2="858" y2="252" stroke-width="1" stroke-dasharray="3 4"/>
  <g class="sans" font-size="13.5">
    <text class="muted" x="370" y="284">Weeks later, in a new session:</text>
    <text class="ink" x="370" y="314" font-weight="600">You</text><text class="ink" x="424" y="314">What did we decide about the cache, and why?</text>
    <text class="ink" x="370" y="344" font-weight="600">Agent</text><text class="ink" x="424" y="344">searches the archives, opens 20261019-…-cache-design.md,</text>
    <text class="ink" x="424" y="366">and answers from what was actually said.</text>
  </g>
</svg>
