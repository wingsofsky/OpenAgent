<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="The main agent reads the handbook, hands a brief to grok, codex, cursor, agy or claude, every round is kept as a record folder, and the main agent checks the result and records a verdict">
  <style>
    .panel { fill: #f6f8fa; stroke: #d1d9e0; } .chip { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .muted { fill: #59636e; } .accent { fill: #bc4c00; }
    .line { stroke: #59636e; fill: none; } .arrowhead { fill: #59636e; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #3d444d; } .chip { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .accent { fill: #f0883e; }
      .line { stroke: #9198a1; } .arrowhead { fill: #9198a1; }
    }
  </style>

  <!-- main agent -->
  <rect class="panel" x="1" y="120" width="200" height="132" rx="10"/>
  <text class="ink sans" x="20" y="152" font-size="16" font-weight="600">Your main agent</text>
  <text class="muted sans" x="20" y="174" font-size="12.5">Claude Code, Codex, …</text>
  <text class="muted sans" x="20" y="204" font-size="12.5">reads the handbook:</text>
  <text class="muted sans" x="20" y="222" font-size="12.5">who is good at what</text>

  <!-- brief out -->
  <path class="line" d="M 202 170 L 262 170" stroke-width="1.5"/>
  <path class="arrowhead" d="M 270 170 L 260 164 L 260 176 Z"/>
  <text class="accent sans" x="236" y="160" font-size="12" text-anchor="middle">① brief</text>

  <!-- executors -->
  <g class="sans" font-size="14">
    <rect class="chip" x="276" y="20" width="250" height="52" rx="8"/>
    <text class="ink mono" x="292" y="43" font-size="14">grok</text><text class="muted" x="292" y="62" font-size="12.5">web and X search, fresh facts</text>
    <rect class="chip" x="276" y="82" width="250" height="52" rx="8"/>
    <text class="ink mono" x="292" y="105" font-size="14">codex</text><text class="muted" x="292" y="124" font-size="12.5">math, numerical code</text>
    <rect class="chip" x="276" y="144" width="250" height="52" rx="8"/>
    <text class="ink mono" x="292" y="167" font-size="14">cursor</text><text class="muted" x="292" y="186" font-size="12.5">multi-file code, tests</text>
    <rect class="chip" x="276" y="206" width="250" height="52" rx="8"/>
    <text class="ink mono" x="292" y="229" font-size="14">agy</text><text class="muted" x="292" y="248" font-size="12.5">explaining, front end, prose</text>
    <rect class="chip" x="276" y="268" width="250" height="52" rx="8"/>
    <text class="ink mono" x="292" y="291" font-size="14">claude</text><text class="muted" x="292" y="310" font-size="12.5">local code and checks</text>
  </g>
  <text class="muted sans" x="401" y="346" font-size="12" text-anchor="middle">headless, each on your own plan</text>

  <!-- answer into record -->
  <path class="line" d="M 527 170 L 588 170" stroke-width="1.5"/>
  <path class="arrowhead" d="M 596 170 L 586 164 L 586 176 Z"/>
  <text class="accent sans" x="560" y="160" font-size="12" text-anchor="middle">② answer</text>

  <!-- record -->
  <rect class="panel" x="602" y="20" width="277" height="300" rx="10"/>
  <text class="ink sans" x="620" y="50" font-size="16" font-weight="600">Every round is kept</text>
  <text class="ink mono" x="620" y="76" font-size="12">~/.openagent/runs/&lt;project&gt;/&lt;task-id&gt;/</text>
  <g class="mono" font-size="13">
    <text class="accent" x="620" y="110">task.md</text>
    <text class="accent" x="620" y="154">transcript.md</text>
    <text class="accent" x="620" y="198">run.json</text>
    <text class="accent" x="620" y="242">work/</text>
  </g>
  <g class="muted sans" font-size="12">
    <text x="620" y="128">brief, outcome, usage, your verdict</text>
    <text x="620" y="172">what was sent, what came back</text>
    <text x="620" y="216">the exact command, each attempt</text>
    <text x="620" y="260">its scratch folder; a snapshot is</text>
    <text x="620" y="276">taken first if it works in the project</text>
  </g>

  <!-- check and verdict back -->
  <path class="line" d="M 740 321 L 740 384 L 100 384 L 100 262" stroke-width="1.5"/>
  <path class="arrowhead" d="M 100 254 L 94 264 L 106 264 Z"/>
  <text class="accent sans" x="420" y="406" font-size="12.5" text-anchor="middle">③ the main agent checks the diff, the tests and the sources, then records accepted, needs rework or rejected</text>
</svg>
