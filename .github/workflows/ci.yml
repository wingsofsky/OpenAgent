name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Every platform is a release platform: report each leg instead of cancelling on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # Before checkout: keep the committed LF bytes that parsers and fixtures expect.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # knip (unused files and exports) and dpdm (import cycles)
      - run: pnpm lint:deps
      - run: pnpm test
      - name: CLI starts from source
        run: pnpm openagent --version
      # Each module installed alone from a sparse clone, its commands run for real
      - name: Modules install on their own
        run: node scripts/check-module-install.mjs
